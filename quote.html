<main id="main"><section class="quote-page"><div class="wrap">
 <h1>Get a quote</h1><p>Tell us what you need. We will reply with a proposal.</p>
 <form id="quote-form" class="on-paper" novalidate>
  <div class="hp" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
  <fieldset class="step"><legend>What do you need?</legend><div class="opts"><label class="opt"><input type="checkbox" name="svc" value="Documentary or report"><span>Documentary or report</span></label><label class="opt"><input type="checkbox" name="svc" value="Commercial or brand film"><span>Commercial or brand film</span></label><label class="opt"><input type="checkbox" name="svc" value="Event or exhibition coverage"><span>Event or exhibition coverage</span></label><label class="opt"><input type="checkbox" name="svc" value="Photography"><span>Photography</span></label><label class="opt"><input type="checkbox" name="svc" value="Other"><span>Other</span></label></div>
   <input type="hidden" id="selected-services" name="selected_services"><input type="hidden" id="project-type" name="project_type"></fieldset>
  <div class="step"><h2 class="h3x">About the project</h2>
   <div class="row2"><div><label for="ed">Preferred date</label><input id="ed" type="date" name="event_date"></div>
   <div><label for="lc">City or location</label><input id="lc" type="text" name="location" required></div></div>
   <div><label for="pd">What should we know about the project?</label><textarea id="pd" name="project_description" required></textarea></div></div>
  <div class="step"><h2 class="h3x">About you</h2>
   <div class="row2"><div><label for="fn">Full name</label><input id="fn" type="text" name="full_name" autocomplete="name" required></div>
   <div><label for="co">Company or organisation</label><input id="co" type="text" name="company_name" autocomplete="organization"></div></div>
   <div class="row2"><div><label for="em">Work email</label><input id="em" type="email" name="email" autocomplete="email" required></div>
   <div><label for="ph">Phone or WhatsApp</label><input id="ph" type="tel" name="phone" autocomplete="tel" required></div></div></div>
  <div class="cf-turnstile" data-sitekey="0x4AAAAAACewk_qC2RQSIRfS" data-theme="auto"></div>
  <button class="btn" type="submit">Send request</button>
  <p class="status" role="status" aria-live="polite"></p>
 </form>
</div></section></main>
