<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آسكُون | قريباً - Coming Soon</title>
    <style>
        /* تصفير الهوامش وجعل الخلفية داكنة تغطي الشاشة بالكامل */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #110408; /* لون خلفية آسكون الداكن */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* لمنع ظهور أشرطة التمرير */
        }
        
        /* ضبط الصورة لتتناسب مع حجم الشاشة بدون تشوه */
        img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- ضع اسم صورتك هنا بدلاً من coming-soon.jpg -->
    <img src="coming-soon.jpg" alt="قريباً - Coming Soon">

</body>
</html>
